
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Le Labyrinthe du Minotaure</title>

    <style>
        body {
            background-color: #211b15;
            color: #f1d9a8;
            font-family: Georgia, serif;
            padding: 30px;
            max-width: 700px;
            margin: auto;
            line-height: 1.8;
        }

        h1 {
            color: #d6a85c;
            text-align: center;
        }

        h2 {
            color: #d6a85c;
        }

        .indice {
            color: #c49c68;
            font-style: italic;
        }

        .adresse {
            background: #100d0a;
            padding: 15px;
            color: #f1c879;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

<h1>LE LABYRINTHE DU MINOTAURE</h1>

<div id="jeu"></div>

<script>

let url = new URLSearchParams(window.location.search);

let salle = url.get("salle");
let cle = url.get("cle");
let direction = url.get("direction");

let jeu = document.getElementById("jeu");


// INTRODUCTION

if (salle == null) {

    jeu.innerHTML = `
        <h2>Le réveil</h2>

        <p>Tu ouvres les yeux.</p>

        <p>Tu es prisonnier d'un immense labyrinthe
        de pierre.</p>

        <p>Au loin, tu entends un rugissement.</p>

        <p>Le Minotaure est réveillé !</p>

        <p>Une inscription apparaît sur le mur :</p>

        <p class="indice">
        "Pour entrer dans le labyrinthe,
        ajoute salle=1 à ton adresse."
        </p>

        <p>Modifie l'adresse de ton navigateur
        pour commencer l'aventure.</p>

        <p class="adresse">?salle=1</p>
    `;

}


// SALLE 1

else if (salle == "1") {

    jeu.innerHTML = `
        <h2>SALLE 1 : LA TORCHE</h2>

        <p>Tu arrives devant une immense porte.</p>

        <p>Une inscription est gravée dans la pierre :</p>

        <p class="indice">
        "Je brille dans la nuit.<br>
        Je dévore le bois.<br>
        Sans moi, impossible de voir dans le noir.<br>
        Qui suis-je ?"
        </p>

        <p>Tu dois trouver le mot secret.</p>

        <p>Pour avancer, modifie ton adresse :</p>

        <p class="adresse">
        ?salle=2&cle=...
        </p>

        <p>Remplace les trois points par ta réponse,
        en minuscules.</p>
    `;

}


// SALLE 2 AVEC LA BONNE CLE

else if (salle == "2" && cle == "torche") {

    jeu.innerHTML = `
        <h2>SALLE 2 : LE CARREFOUR</h2>

        <p>La porte s'ouvre !</p>

        <p>Tu arrives devant trois chemins.</p>

        <p>Une inscription indique :</p>

        <p class="indice">
        "Le soleil se lève à l'est.<br>
        Il se couche à l'ouest.<br>
        C'est de ce côté que se trouve la sortie."
        </p>

        <p>Tu dois choisir la bonne direction.</p>

        <p>Modifie ton adresse :</p>

        <p class="adresse">
        ?salle=3&cle=torche&direction=...
        </p>

        <p>Remplace les trois points par la direction
        que tu as trouvée.</p>
    `;

}


// SALLE 2 AVEC UNE MAUVAISE CLE

else if (salle == "2") {

    jeu.innerHTML = `
        <h2>PORTE FERMEE !</h2>

        <p>La clé ne fonctionne pas.</p>

        <p class="indice">
        Le Minotaure approche...
        </p>

        <p>Retourne à la salle 1 et cherche
        la bonne réponse.</p>
    `;

}


// SALLE 3 : VICTOIRE

else if (
    salle == "3" &&
    cle == "torche" &&
    direction == "ouest"
) {

    jeu.innerHTML = `
        <h2>BRAVO ! TU ES LIBRE !</h2>

        <p>Tu as trouvé le bon chemin.</p>

        <p>Une immense porte s'ouvre devant toi.</p>

        <p>Tu entends le Minotaure rugir derrière toi,
        mais il est trop tard !</p>

        <p>Tu as réussi à sortir du labyrinthe !</p>

        <h2>FELICITATIONS, HEROS !</h2>
    `;

}


// MAUVAISE DIRECTION

else if (salle == "3") {

    jeu.innerHTML = `
        <h2>IMPASSE !</h2>

        <p>Tu as pris le mauvais chemin.</p>

        <p>Un mur bloque ton passage.</p>

        <p>Le Minotaure se rapproche...</p>

        <p>Retourne au carrefour et réfléchis
        à la bonne direction.</p>
    `;

}


// SALLE INCONNUE

else {

    jeu.innerHTML = `
        <h2>UN MUR DE PIERRE</h2>

        <p>Tu es perdu dans le labyrinthe.</p>

        <p>Cette salle n'existe pas.</p>

        <p>Vérifie ton adresse.</p>
    `;

}

</script>

</body>
</html>
